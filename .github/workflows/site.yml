name: Build site

on:
  push:
    branches: [main]
    paths: ["data/**", "scripts/**", ".github/workflows/site.yml"]
  schedule:
    - cron: "17 20 * * *" # nightly, 01:47 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync GitHub repos
        run: node scripts/sync-github.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate data
        run: node scripts/check.mjs
      - name: Build
        run: node scripts/build.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "site-bot"
            git config user.email "site-bot@users.noreply.github.com"
            git add -A
            git commit -m "Rebuild site from data"
            git push
          else
            echo "No changes"
          fi
